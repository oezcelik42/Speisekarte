    <style>
/*__FONTS__*/
      :root {
        --bg: #0f2119;
        --bg-deep: #0a1711;
        --panel: rgba(247, 239, 223, 0.035);
        --panel-2: rgba(247, 239, 223, 0.065);
        --line: rgba(217, 180, 106, 0.2);
        --line-2: rgba(217, 180, 106, 0.45);
        --gold: #d9b46a;
        --gold-2: #f2dca6;
        --cream: #f7efdf;
        --cream-2: #e6dcc8;
        --muted: rgba(230, 220, 200, 0.64);
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        --r: 22px;
        --nav-h: 58px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; background: var(--bg-deep); }
      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--cream);
        font: 500 15px/1.5 "Montserrat", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      img, video { display: block; max-width: 100%; }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      a { color: inherit; }
      .serif { font-family: "Fraunces", Georgia, serif; }

      /* ---------- Hintergrund (fest): grüne Lichter, osmanisches Muster ---------- */
      #bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--bg); pointer-events: none; }
      #bg::before {
        content: ""; position: absolute; inset: -20%;
        background:
          radial-gradient(40% 30% at 50% 0%, rgba(217, 180, 106, 0.12), transparent 70%),
          radial-gradient(60% 45% at 15% 30%, rgba(52, 104, 82, 0.45), transparent 70%),
          radial-gradient(55% 40% at 90% 75%, rgba(44, 90, 72, 0.35), transparent 70%);
        animation: drift 26s ease-in-out infinite alternate;
      }
      #bg::after {
        content: ""; position: absolute; inset: 0; opacity: 0.07;
        background-image: url("__PATTERN__");
        background-size: 120px 120px;
        -webkit-mask-image: linear-gradient(to bottom, transparent, #000 25%, #000 75%, transparent);
        mask-image: linear-gradient(to bottom, transparent, #000 25%, #000 75%, transparent);
      }
      @keyframes drift { from { transform: translate3d(-3%, -2%, 0) scale(1); } to { transform: translate3d(3%, 2%, 0) scale(1.06); } }

      /* ---------- Kopf mit Video ---------- */
      .hero { position: relative; height: min(86svh, 780px); min-height: 560px; overflow: hidden; display: grid; place-items: center; isolation: isolate; }
      .hero-v { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transform: scale(1.06); animation: heroZoom 14s ease-out forwards; }
      @keyframes heroZoom { to { transform: scale(1); } }
      .hero-shade {
        position: absolute; inset: 0; z-index: -1;
        background:
          radial-gradient(120% 70% at 50% 42%, rgba(10, 23, 17, 0.12), rgba(10, 23, 17, 0.7) 78%),
          linear-gradient(to bottom, rgba(10, 23, 17, 0.7) 0%, rgba(10, 23, 17, 0.12) 30%, rgba(15, 33, 25, 0.5) 70%, var(--bg) 100%);
      }
      #dust { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
      .hero-in { position: relative; z-index: 1; text-align: center; padding: 0 24px; margin-top: -4svh; }
      .logo-wrap { position: relative; width: min(56vw, 230px); margin: 0 auto; aspect-ratio: 520 / 402; }
      .js .logo-wrap { opacity: 0; transform: translateY(10px) scale(0.96); animation: rise 1.1s var(--ease) 0.15s forwards; }
      .logo-wrap img { width: 100%; height: 100%; filter: drop-shadow(0 6px 24px rgba(0, 0, 0, 0.45)); }
      .logo-shine {
        position: absolute; inset: 0; overflow: hidden;
        -webkit-mask: url("__LOGO_WEBP__") center / 100% 100% no-repeat; mask: url("__LOGO_WEBP__") center / 100% 100% no-repeat;
      }
      .logo-shine::after {
        content: ""; position: absolute; top: -20%; bottom: -20%; width: 45%; left: -60%;
        background: linear-gradient(100deg, transparent, rgba(255, 248, 225, 0.95), transparent);
        animation: shine 5.5s var(--ease) 1.2s infinite;
      }
      @keyframes shine { 0% { left: -60%; } 22%, 100% { left: 120%; } }
      .orn { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 18px auto 0; width: min(64vw, 260px); }
      .orn i { flex: 1; height: 1.5px; background: var(--gold); transition: transform 1s var(--ease) 0.2s; }
      .js .orn i { transform: scaleX(0); }
      .orn i:first-child { transform-origin: 100% 50%; }
      .orn i:last-child { transform-origin: 0 50%; }
      .orn b { width: 10px; height: 10px; border: 1.5px solid var(--gold); transform: rotate(45deg); transition: transform 0.7s var(--ease); }
      .js .orn b { transform: rotate(45deg) scale(0); }
      .js .ready .hero .orn i, .js .in .orn i { transform: scaleX(1); }
      .js .ready .hero .orn b, .js .in .orn b { transform: rotate(45deg) scale(1); }
      .hero .orn i { transition-delay: 0.7s; }
      .hero .orn b { transition-delay: 0.55s; }
      .hero h1 { font: 800 clamp(40px, 12vw, 56px)/1.04 "Fraunces", serif; letter-spacing: -0.015em; margin-top: 16px; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
      .slogan { font: italic 500 19px/1.3 "Fraunces", serif; color: var(--gold-2); margin-top: 10px; }
      .slogan-sub { font: 600 11px/1.4 "Montserrat", sans-serif; letter-spacing: 0.22em; text-transform: uppercase; color: var(--cream-2); margin-top: 6px; }
      .js .hero h1 { opacity: 0; animation: rise 1s var(--ease) 0.6s forwards; }
      .js .slogan { opacity: 0; animation: rise 1s var(--ease) 0.8s forwards; }
      .js .slogan-sub { opacity: 0; animation: rise 1s var(--ease) 0.95s forwards; }
      .slogan-sub:empty { display: none; }
      @keyframes rise { to { opacity: 1; transform: none; } }
      .cue { position: absolute; bottom: 26px; left: 0; right: 0; width: max-content; margin: 0 auto; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; font: 600 11px/1 "Montserrat"; letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold-2); }
      .js .cue { opacity: 0; animation: rise 1s var(--ease) 1.3s forwards; }
      .cue i { width: 1.5px; height: 34px; background: linear-gradient(var(--gold), transparent); position: relative; overflow: hidden; }
      .cue i::after { content: ""; position: absolute; left: 0; width: 100%; height: 12px; background: var(--gold-2); animation: drop 2s ease-in-out infinite; }
      @keyframes drop { from { top: -12px; } to { top: 34px; } }

      /* ---------- Sprachwahl ---------- */
      .lang { display: inline-flex; gap: 2px; padding: 3px; border-radius: 99px; background: rgba(10, 23, 17, 0.55); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
      .lang button { font: 700 11px/1 "Montserrat"; letter-spacing: 0.08em; padding: 8px 10px; border-radius: 99px; color: var(--cream-2); transition: background 0.3s, color 0.3s; }
      .lang button[aria-pressed="true"] { background: var(--gold); color: #10231b; }
      .hero > .lang { position: absolute; top: max(14px, env(safe-area-inset-top)); right: 14px; z-index: 3; }
      .js .hero > .lang { opacity: 0; animation: rise 0.8s var(--ease) 0.4s forwards; }

      /* ---------- Navigation (klebt oben) ---------- */
      .nav { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 8px; height: var(--nav-h); padding: 0 10px 0 0; background: rgba(11, 24, 18, 0.82); backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2); border-bottom: 1px solid var(--line); }
      .chips { flex: 1; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 0 12px; scroll-snap-type: x proximity; -webkit-mask-image: linear-gradient(90deg, transparent, #000 12px, #000 calc(100% - 18px), transparent); mask-image: linear-gradient(90deg, transparent, #000 12px, #000 calc(100% - 18px), transparent); }
      .chips::-webkit-scrollbar { display: none; }
      .chip { flex: none; display: inline-block; text-decoration: none; scroll-snap-align: start; font: 600 13px/1 "Montserrat"; padding: 10px 14px; border-radius: 99px; color: var(--cream-2); border: 1px solid transparent; transition: background 0.35s, color 0.35s, border-color 0.35s; white-space: nowrap; }
      .chip.on { background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: #10231b; box-shadow: 0 4px 16px rgba(217, 180, 106, 0.25); }
      .lm { position: relative; flex: none; }
      .lm-btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line-2); font: 700 12px/1 "Montserrat"; letter-spacing: 0.08em; color: var(--gold-2); }
      .lm-btn svg { width: 15px; height: 15px; }
      .lm-menu { position: absolute; right: 0; top: 44px; display: grid; gap: 2px; padding: 6px; min-width: 132px; border-radius: 16px; background: rgba(11, 24, 18, 0.97); border: 1px solid var(--line-2); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5); opacity: 0; transform: translateY(-6px) scale(0.98); transform-origin: top right; pointer-events: none; transition: opacity 0.25s, transform 0.3s var(--ease); }
      .lm.open .lm-menu { opacity: 1; transform: none; pointer-events: auto; }
      .lm-menu button { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; font: 600 14px/1 "Montserrat"; color: var(--cream-2); text-align: left; }
      .lm-menu button small { font: 700 10px/1 "Montserrat"; letter-spacing: 0.12em; color: var(--gold); }
      .lm-menu button[aria-pressed="true"] { background: rgba(217, 180, 106, 0.16); color: var(--cream); }

      /* ---------- Kategorien ---------- */
      main { max-width: 620px; margin: 0 auto; padding: 8px 14px 40px; }
      .cat { padding-top: 44px; scroll-margin-top: calc(var(--nav-h) - 8px); }
      .cat-h { text-align: center; padding: 0 10px 20px; }
      .kicker { font: 700 11px/1 "Montserrat"; letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold); }
      .cat-h h2 { font: 800 clamp(30px, 9vw, 40px)/1.08 "Fraunces", serif; letter-spacing: -0.01em; margin-top: 10px; }
      .cat-h .orn { margin-top: 14px; width: 190px; }
      .intro { color: var(--muted); margin: 14px auto 0; max-width: 34ch; font-size: 15px; }

      .js .rv { opacity: 0; transform: translateY(22px); transition: opacity 0.8s var(--ease), transform 0.8s var(--ease); transition-delay: var(--d, 0ms); }
      .js .rv.in { opacity: 1; transform: none; }

      /* Umschalter mit / ohne Eis */
      .mode { display: flex; justify-content: center; margin: 2px 0 18px; }
      .seg { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); width: min(100%, 340px); }
      .seg::before { content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 99px; background: linear-gradient(180deg, var(--gold-2), var(--gold)); transition: transform 0.45s var(--ease); box-shadow: 0 6px 18px rgba(217, 180, 106, 0.28); }
      .seg[data-mode="ohne"]::before { transform: translateX(100%); }
      .seg button { position: relative; z-index: 1; font: 700 13px/1 "Montserrat"; padding: 12px 10px; border-radius: 99px; color: var(--cream-2); transition: color 0.35s; }
      .seg[data-mode="mit"] button[data-mode="mit"], .seg[data-mode="ohne"] button[data-mode="ohne"] { color: #10231b; }

      .goods { display: grid; gap: 10px; margin-bottom: 14px; }
      .list { display: grid; gap: 12px; }

      /* ---------- Produktkarte ---------- */
      .item { position: relative; border-radius: var(--r); background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); overflow: hidden; }
      .item::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(115deg, transparent 35%, rgba(242, 220, 166, 0.16) 50%, transparent 65%) -150% 0 / 250% 100% no-repeat; }
      .item.open::before { animation: sweep 1.2s var(--ease); }
      @keyframes sweep { to { background-position: 150% 0; } }
      .item.open { border-color: var(--line-2); }
      .item-main { display: grid; grid-template-columns: 96px 1fr auto; gap: 14px; align-items: center; padding: 14px 16px 14px 10px; }
      .item.nopic .item-main { grid-template-columns: 1fr auto; padding-left: 18px; }
      .pic { position: relative; width: 96px; height: 96px; display: grid; place-items: center; }
      .plate { position: absolute; inset: 6px; border-radius: 50%; background: radial-gradient(closest-side, rgba(242, 220, 166, 0.28), rgba(217, 180, 106, 0.08) 60%, transparent); }
      .pic img { position: absolute; max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.45)); animation: float 6s ease-in-out infinite; animation-delay: var(--fd, 0s); transition: opacity 0.45s ease; }
      .pic img.b { opacity: 0; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      .txt { min-width: 0; }
      .txt h3 { font: 700 21px/1.12 "Fraunces", serif; letter-spacing: -0.005em; }
      .sub { color: var(--muted); font-size: 13.5px; line-height: 1.35; margin-top: 4px; }
      .alg { display: inline-block; margin-left: 6px; font: 600 9.5px/1 "Montserrat", sans-serif; letter-spacing: 0.06em; color: rgba(217, 180, 106, 0.7); vertical-align: 0.5em; white-space: nowrap; text-transform: none; }
      .rn .alg { margin-left: 5px; vertical-align: 0.45em; }
      .nw { white-space: nowrap; }
      .milk .alg, .note .alg { vertical-align: 0.15em; margin-left: 5px; }
      .tag { display: inline-block; vertical-align: 3px; margin-left: 6px; font: 700 9.5px/1 "Montserrat"; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); border: 1px solid var(--line-2); border-radius: 99px; padding: 4px 7px; }
      .price { font: 700 18px/1 "Montserrat"; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; align-self: start; padding-top: 4px; }
      .what { display: inline-flex; align-items: center; gap: 7px; margin-top: 10px; font: 600 12px/1 "Montserrat"; color: var(--gold-2); padding: 7px 11px 7px 7px; border-radius: 99px; border: 1px solid var(--line-2); background: rgba(217, 180, 106, 0.06); transition: background 0.3s; }
      .what .q { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: #10231b; font: 800 11px/1 "Montserrat"; transition: transform 0.45s var(--ease); }
      .open .what { background: rgba(217, 180, 106, 0.16); }
      .open .what .q { transform: rotate(135deg); }
      .what .x { display: none; }

      /* Preis-Kacheln (Helva, Sandwiches, Größen) */
      .pills { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
      .pill { min-width: 78px; padding: 7px 10px 8px; border-radius: 12px; background: rgba(10, 23, 17, 0.45); border: 1px solid var(--line); }
      .pill small { display: block; font: 700 9.5px/1 "Montserrat"; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
      .pill b { display: block; margin-top: 5px; font: 700 17px/1 "Montserrat"; font-variant-numeric: tabular-nums; }
      .pill b.flip { animation: flip 0.5s var(--ease); }
      @keyframes flip { 0% { opacity: 1; transform: none; } 45% { opacity: 0; transform: translateY(-8px); } 55% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: none; } }

      /* Sorten */
      .flavors { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 16px 14px 18px; }
      .fl { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 "Montserrat"; padding: 6px 10px 6px 6px; border-radius: 99px; border: 1px solid var(--line); background: rgba(10, 23, 17, 0.4); color: var(--cream-2); transition: all 0.3s; }
      .fl img { width: 20px; height: 20px; object-fit: contain; }
      .fl .dot { width: 14px; height: 14px; border-radius: 50%; margin: 3px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25); }
      .fl.on { border-color: var(--gold); background: rgba(217, 180, 106, 0.18); color: var(--cream); }

      /* Varianten-Liste */
      .vars { list-style: none; margin: -2px 16px 14px 18px; border-top: 1px solid var(--line); }
      .vars li { display: flex; align-items: baseline; gap: 8px; padding: 10px 0; border-bottom: 1px dashed rgba(217, 180, 106, 0.16); }
      .vars li:last-child { border-bottom: 0; }
      .vars span { flex: 1; font-size: 15px; color: var(--cream-2); }
      .vars b { font: 700 16px/1 "Montserrat"; font-variant-numeric: tabular-nums; }

      /* Erklär-Fläche */
      .more { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 0.55s var(--ease); }
      .js .more { grid-template-rows: 0fr; }
      .js .open > .more { grid-template-rows: 1fr; }
      .more-in { min-height: 0; overflow: hidden; }
      .explain { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: center; margin: 0 14px 16px; padding: 14px; border-radius: 18px; background: rgba(10, 23, 17, 0.55); border: 1px solid var(--line); transition: opacity 0.5s ease 0.1s, transform 0.6s var(--ease) 0.1s; }
      .js .explain { opacity: 0; transform: translateY(-8px); }
      .js .open .explain { opacity: 1; transform: none; }
      .explain.wide { grid-template-columns: 1fr; }
      .media { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 16 / 10; max-height: 220px; background: radial-gradient(closest-side, rgba(242, 220, 166, 0.22), rgba(217, 180, 106, 0.05) 70%, transparent); }
      .media video, .media .vposter { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.08); transition: transform 1.4s var(--ease); }
      .open .media video, .open .media .vposter, html:not(.js) .media .vposter { transform: scale(1); }
      html:not(.js) .media video { display: none; }
      .media.img img { position: absolute; inset: 8% 10%; width: 80%; height: 84%; object-fit: contain; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.5)); }
      .open .media.img img { animation: kb 9s ease-in-out infinite alternate; }
      @keyframes kb { from { transform: scale(1) translateY(0); } to { transform: scale(1.08) translateY(-3%); } }
      .media::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(242, 220, 166, 0.25); pointer-events: none; }
      .explain p { font-size: 14.5px; line-height: 1.55; color: var(--cream-2); }
      .explain .e-h { font: 700 11px/1 "Montserrat"; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
      .explain.vid { grid-template-columns: 1fr; }
      .explain.vid .media { aspect-ratio: 1 / 1; max-height: 340px; }

      /* Gut zu wissen (Helva) */
      .good { border-radius: 18px; border: 1px solid var(--line); background: var(--panel); overflow: hidden; }
      .good > button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; text-align: left; }
      .good .q { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: #10231b; font: 800 13px/1 "Montserrat"; transition: transform 0.45s var(--ease); }
      .good.open .q { transform: rotate(135deg); }
      .good .gt { flex: 1; font: 700 17px/1.2 "Fraunces", serif; }
      .good .chev { width: 9px; height: 9px; border-right: 1.5px solid var(--gold); border-bottom: 1.5px solid var(--gold); transform: rotate(45deg); transition: transform 0.45s var(--ease); margin-right: 4px; }
      .good.open .chev { transform: rotate(225deg); }
      .good .explain { margin-top: 0; }

      /* Gruppen (Getränke) */
      .group { border-radius: var(--r); border: 1px solid var(--line); background: linear-gradient(180deg, var(--panel-2), var(--panel)); overflow: hidden; }
      .group-h { display: flex; align-items: center; gap: 14px; padding: 12px 16px 6px 10px; }
      .gpic { position: relative; width: 74px; height: 74px; display: grid; place-items: center; flex: none; }
      .gpic img { position: absolute; max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.45)); animation: float 6s ease-in-out infinite; animation-delay: var(--fd, 0s); }
      .group-h h3 { font: 700 21px/1.12 "Fraunces", serif; }
      .sgroup-h { display: flex; align-items: center; gap: 12px; margin: 26px 4px 12px; }
      .sgroup-h h3 { font: 700 20px/1 "Fraunces", serif; white-space: nowrap; }
      .sgroup-h::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-2), transparent); }
      .sgroup-h .cols { display: flex; gap: 8px; order: 3; }
      .rows { list-style: none; padding: 0 16px 8px 18px; }
      .rowi { border-top: 1px solid rgba(217, 180, 106, 0.14); }
      .rowi:first-child { border-top: 0; }
      .row-main { display: flex; align-items: center; gap: 10px; padding: 12px 0; }
      .row-main .rt { flex: 1; min-width: 0; }
      .row-main .rn { font: 600 16px/1.25 "Fraunces", serif; color: var(--cream); }
      .row-main .rs { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
      .row-main .rp { font: 700 16px/1 "Montserrat"; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .row-main .rp em { font-style: normal; font: 700 10px/1 "Montserrat"; letter-spacing: 0.1em; color: var(--gold); margin: 0 4px 0 10px; text-transform: uppercase; }
      .row-main .rp em:first-child { margin-left: 0; }
      .qbtn { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-2); color: var(--gold-2); font: 800 12px/1 "Montserrat"; background: rgba(217, 180, 106, 0.06); transition: transform 0.45s var(--ease), background 0.3s; }
      .rowi.open .qbtn { transform: rotate(135deg); background: rgba(217, 180, 106, 0.2); }
      .rowi .explain { margin: 0 0 14px; }
      .rowi .explain.noimg { grid-template-columns: 1fr; }

      /* Hinweise */
      .note { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 14px 16px; border-radius: 18px; border: 1px dashed var(--line-2); background: rgba(217, 180, 106, 0.05); }
      .note .nl { font: 700 10px/1.2 "Montserrat"; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
      .note .nt { flex: 1; font-size: 14px; color: var(--cream-2); margin-top: 3px; }
      .note b { font: 700 16px/1 "Montserrat"; white-space: nowrap; }
      .note.block { display: block; }
      .note.block ul { list-style: none; margin-top: 8px; }
      .note.block li { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid rgba(217, 180, 106, 0.12); font-size: 14.5px; color: var(--cream-2); }
      .note.block li b { color: var(--cream); }
      .milk { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .milk > span { font: 600 12px/1 "Montserrat"; padding: 8px 11px; border-radius: 99px; border: 1px solid var(--line); color: var(--cream-2); }
      .allerg { text-align: center; margin-top: 14px; font: 600 11.5px/1.4 "Montserrat"; letter-spacing: 0.08em; color: var(--muted); }
      .allerg b { color: var(--gold); letter-spacing: 0.16em; text-transform: uppercase; font-size: 10.5px; margin-right: 6px; }

      /* ---------- Fuß ---------- */
      footer { text-align: center; padding: 50px 22px calc(40px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: linear-gradient(180deg, transparent, rgba(10, 23, 17, 0.8)); }
      footer .flogo { width: 120px; margin: 0 auto; opacity: 0.95; }
      footer .place { margin-top: 14px; font: 600 12px/1.4 "Montserrat"; letter-spacing: 0.16em; text-transform: uppercase; color: var(--cream-2); }
      footer .insta { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; padding: 11px 16px; border-radius: 99px; border: 1px solid var(--line-2); text-decoration: none; font: 600 13px/1 "Montserrat"; color: var(--gold-2); }
      footer .insta svg { width: 16px; height: 16px; }
      footer .legend { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; max-width: 300px; margin: 26px auto 0; text-align: left; font-size: 12.5px; color: var(--muted); }
      footer .legend b { color: var(--gold); font: 700 12px/1.5 "Montserrat"; }
      footer .fnote, footer .vat { margin-top: 16px; font-size: 12.5px; color: var(--muted); }
      footer .lang { margin-top: 22px; }

      /* Tippflächen mindestens ~44 px, ohne die Optik zu ändern */
      .what, .qbtn, .fl, .chip, .lm-btn, .lang button { position: relative; }
      .what::after, .fl::after { content: ""; position: absolute; inset: -6px -4px; }
      .qbtn::after, .lm-btn::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; }
      .chip::after { content: ""; position: absolute; inset: -6px -2px; }
      .lang button::after { content: ""; position: absolute; inset: -6px -1px; }
      main { padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
      @media (max-width: 370px) {
        main { padding-left: 10px; padding-right: 10px; }
        .item-main { grid-template-columns: 82px 1fr auto; gap: 11px; padding: 12px 13px 12px 7px; }
        .pic { width: 82px; height: 82px; }
        .txt h3 { font-size: 19.5px; }
        .price { font-size: 17px; }
        .pill { min-width: 70px; padding: 7px 9px 8px; }
        .pill b { font-size: 16px; }
        .chip { padding: 10px 12px; font-size: 12.5px; }
        .rows { padding: 0 13px 8px 14px; }
      }
      @media (min-width: 640px) {
        .item-main { grid-template-columns: 112px 1fr auto; }
        .pic { width: 112px; height: 112px; }
      }
      /* Ohne Skript (z. B. WhatsApp-Vorschau): Karte vollständig, Erklärungen offen, Schalter ausgeblendet */
      .nojs { display: none; }
      html:not(.js) .nojs { display: block; }
      html:not(.js) .what, html:not(.js) .qbtn, html:not(.js) .good .q, html:not(.js) .good .chev,
      html:not(.js) .lang, html:not(.js) .lm, html:not(.js) .mode, html:not(.js) .cue { display: none !important; }
      html:not(.js) .good > button { cursor: default; }
      .hl-lab { margin-top: 8px; font: 700 9.5px/1 "Montserrat"; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
      .hl-lab + .pills { margin-top: 6px; }
      .hl-alt { margin-top: 8px; font-size: 13px; color: var(--cream-2); }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
        .hero-v { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="bg"></div>

    <header class="hero" id="top">
      <video class="hero-v" id="heroVideo" poster="__HERO_POSTER__" data-mp4="__HERO_VIDEO__" data-webm="__HERO_WEBM__" muted loop playsinline preload="none" aria-hidden="true"></video>
      <div class="hero-shade"></div>
      <canvas id="dust" aria-hidden="true"></canvas>
      <div class="lang" data-lang-switch>__PRE_LANG__</div>
      <div class="hero-in">
        <div class="logo-wrap"><img src="__LOGO_WEBP__" width="520" height="402" alt="Helvacı Yakub Efendi" /><span class="logo-shine"></span></div>
        <div class="orn" aria-hidden="true"><i></i><b></b><i></i></div>
        <h1 data-ui="title">__UI_title__</h1>
        <p class="slogan">Tarihi Asırlık Lezzet</p>
        <p class="slogan-sub" data-ui="slogan_sub">__UI_slogan_sub__</p>
      </div>
      <a class="cue" href="#helva"><span data-ui="cue">__UI_cue__</span><i></i></a>
    </header>

    <nav class="nav" id="nav" aria-label="Kategorien">
      <div class="chips" id="chips">__PRE_CHIPS__</div>
      <div class="lm" id="lm">__PRE_LM__</div>
    </nav>

    <main id="menu">__PRE_MAIN__</main>

    <footer>
      <img class="flogo" src="__LOGO_WEBP__" alt="Helvacı Yakub Efendi" loading="lazy" />
      <p class="place" data-ui="place">__UI_place__</p>
      <a class="insta" href="https://www.instagram.com/helvaciyakub.frankfurt/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" /><circle cx="12" cy="12" r="4.2" /><circle cx="17.4" cy="6.6" r="1" fill="currentColor" stroke="none" /></svg>
        <span><span data-ui="follow">__UI_follow__</span> · @helvaciyakub.frankfurt</span>
      </a>
      <div class="legend" id="legend">__PRE_LEGEND__</div>
      <p class="fnote" data-ui="allergy_note">__UI_allergy_note__</p>
      <p class="vat" data-ui="vat">__UI_vat__</p>
      <div class="lang" data-lang-switch>__PRE_LANG__</div>
    </footer>

    <script>
      window.__ASSETS = __ASSETS__;
    </script>
    <script>
/*__CORE__*/
    </script>
    <script>
      (function () {
        "use strict";
        const DATA = __DATA__;
        const PRE_LANG = "de"; // in dieser Sprache steht die Karte fest in der Datei
        const ASSETS = window.__ASSETS;
        // Bild/Video: eingebettet (Vorschau-Datei), schon in der Seite vorhanden, oder vom Server
        function fromDom(p) {
          const el = document.querySelector('[data-asset="' + p + '"]');
          return el ? el.getAttribute("src") : null;
        }
        const A = (p) => (ASSETS && (ASSETS[p] || fromDom(p))) || "assets/" + p;
        const IMG = (k) => A("img/" + k + ".webp");
        const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const MP4 = !!document.createElement("video").canPlayType('video/mp4; codecs="avc1.640028"');
        const VID = (k) => (MP4 ? A("video/" + k + ".mp4") : (ASSETS && ASSETS["video/" + k + ".webm"]) || A("video/" + k + ".webm"));
        // Hero-Video erst nach dem Laden der Seite – nicht bei Datensparmodus oder „Bewegung reduzieren"
        const saveData = !!(navigator.connection && navigator.connection.saveData);
        function startHero() {
          const hv = document.getElementById("heroVideo");
          if (!hv || saveData || reduced) return;
          hv.src = MP4 ? hv.dataset.mp4 : hv.dataset.webm;
          const p = hv.play();
          if (p && p.catch) p.catch(() => {});
        }
        if (document.readyState === "complete") setTimeout(startHero, 150);
        else addEventListener("load", () => setTimeout(startHero, 150));

        const core = HYE_CORE(DATA, { A });
        const U = (k) => core.U(k);
        const eur = (p) => String(p).replace(/[&<>"]/g, "") + "&nbsp;€";

        // ---------- Sprache ----------
        function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
        function pickLang() {
          const q = new URLSearchParams(location.search).get("lang");
          if (core.LANGS.includes(q)) return q;
          const s = store("hye-lang");
          if (core.LANGS.includes(s)) return s;
          const n = (navigator.language || "de").slice(0, 2).toLowerCase();
          return n === "tr" ? "tr" : n === "de" ? "de" : n === "en" ? "en" : "de";
        }
        let lang = pickLang();
        let helvaMode = "mit";

        // ---------- Aufbauen (nur bei Sprachwechsel; Deutsch steht schon in der Datei) ----------
        const main = document.getElementById("menu");
        const chips = document.getElementById("chips");
        function render() {
          const R = core.renderAll(lang, helvaMode);
          document.documentElement.lang = lang;
          main.innerHTML = R.main;
          chips.innerHTML = R.chips;
          document.getElementById("lm").innerHTML = R.lm;
          document.querySelectorAll("[data-lang-switch]").forEach((el) => (el.innerHTML = R.langSwitch));
          document.getElementById("legend").innerHTML = R.legend;
          document.querySelectorAll("[data-ui]").forEach((el) => (el.textContent = R.ui[el.dataset.ui] || ""));
          document.title = R.title;
          observeReveal();
          observeSpy();
        }

        // ---------- Einblenden beim Scrollen ----------
        let revIO;
        function observeReveal() {
          if (revIO) revIO.disconnect();
          const els = document.querySelectorAll(".rv:not(.in)");
          if (reduced || !("IntersectionObserver" in window)) { els.forEach((e) => e.classList.add("in")); return; }
          revIO = new IntersectionObserver((ents) => ents.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); revIO.unobserve(e.target); } }), { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });
          els.forEach((e) => revIO.observe(e));
        }

        // ---------- Aktive Kategorie ----------
        let spyIO;
        function setChip(id) {
          chips.querySelectorAll(".chip").forEach((c) => {
            const on = c.dataset.go === id;
            if (on && !c.classList.contains("on")) {
              const r = c.getBoundingClientRect(), pr = chips.getBoundingClientRect();
              chips.scrollTo({ left: chips.scrollLeft + r.left - pr.left - (pr.width - r.width) / 2, behavior: reduced ? "auto" : "smooth" });
            }
            c.classList.toggle("on", on);
          });
        }
        function observeSpy() {
          if (spyIO) spyIO.disconnect();
          if (!("IntersectionObserver" in window)) return;
          spyIO = new IntersectionObserver((ents) => ents.forEach((e) => e.isIntersecting && setChip(e.target.id)), { rootMargin: "-35% 0px -60% 0px" });
          document.querySelectorAll("[data-cat]").forEach((s) => spyIO.observe(s));
        }

        // ---------- Öffnen / Schließen der Erklärung ----------
        function setOpen(box, open) {
          box.classList.toggle("open", open);
          box.querySelectorAll(":scope > .item-main [data-toggle], :scope > button[data-toggle], :scope > .row-main [data-toggle]").forEach((b) => {
            b.setAttribute("aria-expanded", open);
            const wl = b.querySelector(".wl");
            if (wl) wl.textContent = open ? U("close") : U("what");
          });
          const v = box.querySelector(":scope > .more video");
          if (v) {
            if (open) { if (!v.getAttribute("src")) v.src = VID(v.dataset.v); const p = v.play(); if (p && p.catch) p.catch(() => {}); }
            else v.pause();
          }
        }
        function toggle(box) {
          const open = !box.classList.contains("open");
          document.querySelectorAll(".item.open, .good.open, .rowi.open").forEach((o) => o !== box && setOpen(o, false));
          setOpen(box, open);
          if (open) {
            // aufgeklappte Fläche ganz ins Bild holen, ohne den Kopf der Karte unter die Leiste zu schieben
            setTimeout(() => {
              const r = box.getBoundingClientRect();
              const navH = document.getElementById("nav").offsetHeight;
              let dy = 0;
              if (r.bottom > innerHeight - 12) dy = r.bottom - innerHeight + 16;
              if (r.top - dy < navH + 8) dy = r.top - navH - 8;
              if (Math.abs(dy) > 4) window.scrollBy({ top: dy, behavior: reduced ? "auto" : "smooth" });
            }, 580);
          }
        }

        // ---------- Sorte wechseln (Bild blendet über) ----------
        function setFlavor(btn) {
          const item = btn.closest(".item");
          item.querySelectorAll(".fl").forEach((f) => f.classList.toggle("on", f === btn));
          const k = btn.dataset.flavor;
          if (!k) return;
          const pic = item.querySelector(".pic");
          const a = pic.querySelector("img.a"), b = pic.querySelector("img.b");
          const show = a.style.opacity === "0" ? a : b, hide = show === a ? b : a;
          const url = IMG(k);
          if ((hide.getAttribute("src") || "") === url && hide.style.opacity !== "0") return;
          show.onload = () => { show.style.opacity = "1"; hide.style.opacity = "0"; };
          if (show.getAttribute("src") === url && show.complete) show.onload();
          else show.src = url;
        }

        // ---------- Helva: mit / ohne Eis ----------
        function setMode(m) {
          if (m === helvaMode) return;
          helvaMode = m;
          const seg = document.querySelector(".seg");
          seg.dataset.mode = m;
          seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === m));
          document.querySelectorAll(".hp").forEach((el, i) => {
            el.classList.remove("flip");
            void el.offsetWidth;
            el.style.animationDelay = (i % 2) * 40 + "ms";
            el.classList.add("flip");
            setTimeout(() => (el.innerHTML = eur(el.dataset[m])), 230 + (i % 2) * 40);
          });
        }

        // ---------- Klicks ----------
        document.addEventListener("click", (e) => {
          const lmw = document.getElementById("lm");
          if (e.target.closest("[data-lm]")) {
            const o = !lmw.classList.contains("open");
            lmw.classList.toggle("open", o);
            lmw.querySelector("[data-lm]").setAttribute("aria-expanded", o);
            return;
          }
          if (!e.target.closest(".lm-menu")) lmw.classList.remove("open");
          const lb = e.target.closest("[data-lang]");
          if (lb) {
            if (lb.dataset.lang !== lang) {
              const y = scrollY;
              lang = lb.dataset.lang;
              store("hye-lang", lang);
              render();
              document.querySelectorAll(".rv").forEach((el) => { const r = el.getBoundingClientRect(); if (r.top < innerHeight) el.classList.add("in"); });
              window.scrollTo(0, y);
            }
            return;
          }
          const go = e.target.closest("[data-go]");
          if (go) { e.preventDefault(); const s = document.getElementById(go.dataset.go); s.scrollIntoView({ behavior: reduced ? "auto" : "smooth" }); setChip(go.dataset.go); return; }
          const md = e.target.closest(".seg [data-mode]");
          if (md) { setMode(md.dataset.mode); return; }
          const fl = e.target.closest(".fl");
          if (fl) { setFlavor(fl); return; }
          const tg = e.target.closest("[data-toggle]");
          if (tg) { toggle(tg.closest(".item, .good, .rowi")); return; }
          // Tippen auf die Karte selbst öffnet ebenfalls (wenn es eine Erklärung gibt)
          const card = e.target.closest(".item, .rowi");
          if (card && card.querySelector(":scope > .more") && !e.target.closest(".more")) toggle(card);
        });

        // ---------- Goldstaub im Kopf ----------
        (function dust() {
          const cv = document.getElementById("dust");
          if (!cv || reduced) return;
          const ctx = cv.getContext("2d");
          let W = 0, H = 0, run = true, P = [];
          const dpr = Math.min(2, window.devicePixelRatio || 1);
          function size() {
            W = cv.clientWidth; H = cv.clientHeight;
            cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            P = Array.from({ length: 26 }, (_, i) => ({ x: ((i * 0.618) % 1) * W, y: ((i * 0.754) % 1) * H, r: 0.8 + ((i * 53) % 10) / 6, v: 6 + ((i * 37) % 14), ph: i * 0.9 }));
          }
          size();
          addEventListener("resize", size);
          new IntersectionObserver((e) => { run = e[0].isIntersecting; if (run) requestAnimationFrame(loop); }).observe(cv);
          let last = performance.now();
          function loop(now) {
            if (!run || document.hidden) return;
            const dt = Math.min(0.05, (now - last) / 1000); last = now;
            ctx.clearRect(0, 0, W, H);
            for (const p of P) {
              p.y -= p.v * dt; p.ph += dt;
              if (p.y < -10) { p.y = H + 10; }
              const a = 0.35 + 0.35 * Math.sin(p.ph * 1.3);
              const x = p.x + Math.sin(p.ph * 0.7) * 8;
              const g = ctx.createRadialGradient(x, p.y, 0, x, p.y, p.r * 4);
              g.addColorStop(0, `rgba(255,236,190,${a})`); g.addColorStop(1, "rgba(217,180,106,0)");
              ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, p.y, p.r * 4, 0, Math.PI * 2); ctx.fill();
            }
            requestAnimationFrame(loop);
          }
          requestAnimationFrame(loop);
          document.addEventListener("visibilitychange", () => { if (!document.hidden && run) { last = performance.now(); requestAnimationFrame(loop); } });
        })();

        if (lang === PRE_LANG) { observeReveal(); observeSpy(); } else render();
        requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("ready")));
      })();
    </script>
